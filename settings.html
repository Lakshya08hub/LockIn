<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Settings — LockIn</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%234f46e5%22/><text x=%2216%22 y=%2222%22 font-size=%2214%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22bold%22>LI</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<link rel="stylesheet" href="shared.css" />
</head>
<body data-page="settings" class="antialiased">
<div id="nav-slot"></div>

<div class="max-w-3xl mx-auto px-6 py-10">
  <h1 class="text-2xl font-extrabold tracking-tight mb-8">Settings</h1>

  <div class="card p-6 mb-6">
    <h2 class="font-bold mb-4">Profile</h2>
    <div class="grid sm:grid-cols-2 gap-4">
      <div>
        <label class="text-sm font-medium block mb-1">Full name</label>
        <input type="text" value="Priya Nair" class="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm" />
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Email</label>
        <input type="email" value="priya.nair@greenfield.edu" class="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm" />
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Institution</label>
        <input type="text" value="Greenfield College" class="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm" />
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Role</label>
        <select class="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm">
          <option>Institution admin</option>
          <option>Tutor / Coaching center</option>
          <option>Student / Parent</option>
        </select>
      </div>
    </div>
  </div>

  <div class="card p-6 mb-6">
    <h2 class="font-bold mb-4">Plan & billing</h2>
    <div class="flex items-center justify-between">
      <div>
        <p class="font-semibold text-sm">Pro plan</p>
        <p class="text-xs text-slate-500">₹999/month &middot; renews 1 Dec 2026</p>
      </div>
      <a href="pricing.html" class="btn-secondary text-sm">Change plan</a>
    </div>
  </div>

  <div class="card p-6 mb-6">
    <h2 class="font-bold mb-4">Notifications</h2>
    <label class="flex items-center justify-between py-2">
      <span class="text-sm">Email me when a student is flagged high-risk</span>
      <input type="checkbox" checked class="w-5 h-5" />
    </label>
    <label class="flex items-center justify-between py-2">
      <span class="text-sm">Weekly cohort summary digest</span>
      <input type="checkbox" checked class="w-5 h-5" />
    </label>
    <label class="flex items-center justify-between py-2">
      <span class="text-sm">Product updates & tips</span>
      <input type="checkbox" class="w-5 h-5" />
    </label>
  </div>

  <div class="card p-6">
    <h2 class="font-bold mb-4">Appearance</h2>
    <div class="flex items-center justify-between">
      <span class="text-sm">Theme</span>
      <div class="flex gap-2 bg-slate-100 rounded-full p-1">
        <button class="px-3 py-1.5 rounded-full text-xs font-semibold bg-white shadow-sm">☀️ Light</button>
        <button class="px-3 py-1.5 rounded-full text-xs font-semibold text-slate-500">🌙 Dark</button>
      </div>
    </div>
  </div>
</div>

<div id="footer-slot"></div>
<script src="components.js"></script>
</body>
</html>
