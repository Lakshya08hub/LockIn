<!doctype html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Sign up — LockIn</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 32 32%22><rect width=%2232%22 height=%2232%22 rx=%228%22 fill=%22%234f46e5%22/><text x=%2216%22 y=%2222%22 font-size=%2214%22 fill=%22white%22 text-anchor=%22middle%22 font-family=%22sans-serif%22 font-weight=%22bold%22>LI</text></svg>" />
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.tailwindcss.com/3.4.16"></script>
<link rel="stylesheet" href="shared.css" />
</head>
<body data-page="signup" class="antialiased">
<div id="nav-slot"></div>

<div class="max-w-md mx-auto px-6 py-16">
  <div class="card p-8">
    <div class="flex gap-2 mb-6 bg-slate-100 rounded-full p-1" id="mode-toggle">
      <button data-mode="signup" class="flex-1 py-2 rounded-full text-sm font-semibold bg-white shadow-sm">Sign up</button>
      <button data-mode="login" class="flex-1 py-2 rounded-full text-sm font-semibold text-slate-500">Log in</button>
    </div>

    <h1 class="text-xl font-bold mb-1" id="form-title">Create your account</h1>
    <p class="text-sm text-slate-500 mb-6" id="form-subtitle">Free forever for one student profile.</p>

    <button class="btn-secondary w-full justify-center mb-4">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#FFC107" d="M43.6 20.5H42V20H24v8h11.3C33.8 32.7 29.3 36 24 36c-6.6 0-12-5.4-12-12s5.4-12 12-12c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3 12.4 3 3 12.4 3 24s9.4 21 21 21 21-9.4 21-21c0-1.4-.1-2.7-.4-4z"/><path fill="#FF3D00" d="m6.3 14.7 6.6 4.8C14.6 16 19 13 24 13c3.1 0 5.8 1.1 8 3l6-6C34.6 5.1 29.6 3 24 3c-7.6 0-14.1 4.3-17.7 10.7z"/><path fill="#4CAF50" d="M24 45c5.5 0 10.4-1.8 14.3-4.9l-6.6-5.4C29.6 36.6 27 37 24 37c-5.3 0-9.7-3.3-11.3-8H5.9v5.2C9.5 40.6 16.2 45 24 45z"/><path fill="#1976D2" d="M43.6 20.5H42V20H24v8h11.3c-.8 2.1-2.1 3.9-3.9 5.3l6.6 5.4C41.9 35.9 45 30.4 45 24c0-1.4-.1-2.7-.4-3.5z"/></svg>
      Continue with Google
    </button>

    <div class="flex items-center gap-3 my-5">
      <div class="h-px bg-slate-200 flex-1"></div>
      <span class="text-xs text-slate-400">or</span>
      <div class="h-px bg-slate-200 flex-1"></div>
    </div>

    <form class="space-y-4" onsubmit="event.preventDefault(); location.href='dashboard.html';">
      <div id="role-field">
        <label class="text-sm font-medium block mb-1">I am a</label>
        <select class="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm">
          <option>Student / Parent</option>
          <option>Tutor / Coaching center</option>
          <option>Institution admin</option>
        </select>
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Full name</label>
        <input type="text" placeholder="Aarav Sharma" class="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm" />
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Email</label>
        <input type="email" placeholder="you@example.com" class="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm" />
      </div>
      <div>
        <label class="text-sm font-medium block mb-1">Password</label>
        <input type="password" placeholder="••••••••" class="w-full border border-slate-200 rounded-lg px-4 py-2.5 text-sm" />
      </div>
      <button type="submit" class="btn-primary w-full justify-center" id="submit-btn">Create free account →</button>
    </form>
    <p class="text-xs text-slate-400 text-center mt-5">By continuing you agree to our Terms & Privacy Policy. This is a UI prototype — no account is actually created.</p>
  </div>
</div>

<div id="footer-slot"></div>
<script src="components.js"></script>
<script>
  function applyMode(mode) {
    document.querySelectorAll('#mode-toggle button').forEach(b => {
      const active = b.dataset.mode === mode;
      b.classList.toggle('bg-white', active);
      b.classList.toggle('shadow-sm', active);
      b.classList.toggle('text-slate-500', !active);
    });
    const isLogin = mode === 'login';
    document.getElementById('form-title').textContent = isLogin ? 'Welcome back' : 'Create your account';
    document.getElementById('form-subtitle').textContent = isLogin ? 'Log in to your LockIn dashboard.' : 'Free forever for one student profile.';
    document.getElementById('role-field').classList.toggle('hidden', isLogin);
    document.getElementById('submit-btn').textContent = isLogin ? 'Log in →' : 'Create free account →';
  }
  document.getElementById('mode-toggle').addEventListener('click', (e) => {
    const btn = e.target.closest('button[data-mode]');
    if (btn) applyMode(btn.dataset.mode);
  });
  const params = new URLSearchParams(location.search);
  if (params.get('mode') === 'login') applyMode('login');
</script>
</body>
</html>
